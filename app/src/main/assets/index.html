<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Offline Flip Clock</title>
<link rel="stylesheet" href="css/clock.css">
</head>
<body>
<div id="corner" class="corner">
  <div class="date-box">
    <span id="date" class="date-text">01 NOVEMBER</span>
  </div>
</div>

<div id="stage" class="stage">

  <div class="card card-hours">
    <div class="half half-top"></div>
    <div class="half half-bottom"></div>
    <div id="hours" class="digits">00</div>
    <div class="fold"></div>
    <div class="pin pin-left"></div>
    <div class="pin pin-right"></div>
  </div>

  <div class="dot dot-top"></div>
  <div class="dot dot-bottom"></div>

  <div class="card card-minutes">
    <div class="half half-top"></div>
    <div class="half half-bottom"></div>
    <div id="minutes" class="digits">00</div>
    <div class="fold"></div>
    <div class="pin pin-left"></div>
    <div class="pin pin-right"></div>
  </div>

</div>
<script src="js/clock.js"></script>
</body>
</html>
