name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show repository content
        run: find . -not -path './.git*' | sort | head -n 200

      - name: Unzip project if only the zip was uploaded
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*')" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then echo "Extracting $ZIP"; unzip -q -o "$ZIP" -d .; fi
          fi

      - name: Locate Android project
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found. Upload the project FILES (settings.gradle, build.gradle, app/...), not only the folder name."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          for f in build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$DIR/$f" ]; then echo "::error::Missing file: $DIR/$f"; MISSING=1; fi
          done
          [ -z "$MISSING" ] || exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: OfflineFlipClock-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
